<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Финмодель отдела продаж</title>
<style>
:root{--paper:#F6F5F0;--card:#FFFFFF;--ink:#22302A;--muted:#5C6B62;--line:#E2E0D6;
--accent:#2E6B4E;--accent-ink:#1E4A36;--field:#FBFAF7;--err:#A33B2E}
@media (prefers-color-scheme: dark){:root{--paper:#141A17;--card:#1C2420;--ink:#E8EAE4;
--muted:#9AA89F;--line:#2A342E;--accent:#6FBF95;--accent-ink:#A8D9BF;--field:#171F1B;--err:#E08476}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:20px}
.gate{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:32px 30px;max-width:380px;width:100%}
h1{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:22px;font-weight:600;margin:0 0 6px}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
background:var(--field);color:var(--ink);font-size:16px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;margin-top:12px;padding:11px;border:none;border-radius:8px;background:var(--accent);
color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.6;cursor:wait}
.err{display:none;color:var(--err);font-size:13.5px;margin-top:10px}
</style>
</head>
<body>
<form class="gate" id="gate">
  <h1>Финмодель отдела продаж</h1>
  <p>Страница защищена. Введите пароль, который вам передали вместе со ссылкой.</p>
  <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" autofocus>
  <button type="submit" id="btn">Открыть</button>
  <div class="err" id="err">Неверный пароль. Проверьте и попробуйте ещё раз.</div>
</form>

function b64d(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function tryOpen(pw){
  var enc=new TextEncoder();
  var baseKey=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64d(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},
    baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(PAYLOAD.iv)},key,b64d(PAYLOAD.data));
  var html=new TextDecoder().decode(plain);
  try{sessionStorage.setItem('fmpw',pw);}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById('gate').addEventListener('submit',function(e){
  e.preventDefault();
  var btn=document.getElementById('btn');btn.disabled=true;
  document.getElementById('err').style.display='none';
  tryOpen(document.getElementById('pw').value).catch(function(){
    btn.disabled=false;
    document.getElementById('err').style.display='block';
  });
});
try{
